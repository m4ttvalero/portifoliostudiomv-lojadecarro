<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Prime Motors — Seminovos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef1f3;
        --sf: #fff;
        --ink: #14213d;
        --mute: #59657a;
        --line: #d5dbe2;
        --red: #c8102e;
        --blue: #1f4e9c;
        --ok: #16794a;
        --onink: #fff;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1424;
          --sf: #172039;
          --ink: #edf0f6;
          --mute: #9aa7bc;
          --line: #2a3556;
          --red: #ff5a70;
          --blue: #7aa3ff;
          --ok: #4cc88a;
          --onink: #0e1424;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1424;
        --sf: #172039;
        --ink: #edf0f6;
        --mute: #9aa7bc;
        --line: #2a3556;
        --red: #ff5a70;
        --blue: #7aa3ff;
        --ok: #4cc88a;
        --onink: #0e1424;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.5 "Instrument Sans",
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }
      h1,
      h2,
      h3 {
        font-family:
          "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
        margin: 0;
        line-height: 1.15;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .mark {
        flex: none;
        width: 64px;
        height: 48px;
        background: #14213d;
        border-radius: 12px;
        padding: 7px 6px;
      }
      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      header h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 2px 0 0;
        color: var(--mute);
        font-size: 0.92rem;
      }
      .demo {
        background: var(--sf);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.86rem;
        color: var(--mute);
        margin-bottom: 16px;
      }
      nav {
        display: flex;
        gap: 4px;
        border-bottom: 2px solid var(--line);
        margin-bottom: 20px;
        overflow-x: auto;
      }
      nav button {
        font:
          600 0.98rem "Instrument Sans",
          sans-serif;
        background: none;
        border: 0;
        color: var(--mute);
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        white-space: nowrap;
      }
      nav button[aria-selected="true"] {
        color: var(--ink);
        border-color: var(--red);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .card h2 {
        font-size: 1.15rem;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.88rem;
        margin-bottom: 4px;
      }
      input,
      select {
        font: inherit;
        width: 100%;
        padding: 9px 11px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }
      input[type="color"] {
        padding: 2px;
        height: 42px;
      }
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 4px 0 12px;
        color: var(--mute);
        flex-wrap: wrap;
      }
      .bar select {
        width: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
        gap: 14px;
      }
      .car {
        background: var(--sf);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .pic {
        background: linear-gradient(var(--bg), var(--line));
        padding: 16px 18px 6px;
        position: relative;
      }
      .pic svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        background: var(--red);
        color: #fff;
        border-radius: 99px;
        padding: 2px 10px;
      }
      .info {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .info h3 {
        font-size: 1.05rem;
      }
      .meta {
        color: var(--mute);
        font-size: 0.88rem;
      }
      .price {
        font:
          800 1.35rem "Bricolage Grotesque",
          sans-serif;
        margin: 6px 0 10px;
      }
      .btn {
        font:
          600 1rem "Instrument Sans",
          sans-serif;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .btn.dark {
        background: var(--ink);
        color: var(--onink);
      }
      .btn.ghost {
        background: none;
        color: var(--ink);
        border: 1.5px solid var(--line);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 0.85rem;
      }
      .btn.del {
        color: var(--red);
        border-color: var(--red);
      }
      .err {
        color: var(--red);
        font-size: 0.9rem;
        min-height: 1.3em;
        margin: 8px 0 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }
      .stat {
        background: var(--sf);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .stat b {
        display: block;
        font:
          800 1.5rem "Bricolage Grotesque",
          sans-serif;
      }
      .stat span {
        color: var(--mute);
        font-size: 0.86rem;
      }
      @media (max-width: 560px) {
        .stats {
          grid-template-columns: 1fr;
        }
      }
      .tbl {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.93rem;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--mute);
        font-weight: 600;
        font-size: 0.85rem;
      }
      td select {
        padding: 5px 8px;
      }
      .sw {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid var(--line);
        vertical-align: -1px;
        margin-right: 6px;
      }
      .empty {
        color: var(--mute);
        margin: 6px 0;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 30, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
      }
      .ov .box {
        background: var(--sf);
        border-radius: 12px;
        max-width: 520px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        padding: 18px;
      }
      .ov dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 16px;
        margin: 12px 0;
      }
      .ov dt {
        color: var(--mute);
      }
      .ov dd {
        margin: 0;
        font-weight: 600;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--onink);
        padding: 10px 18px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
      }
      .toast.show {
        opacity: 1;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="mark" id="logo" aria-hidden="true"></div>
        <div>
          <h1>Prime Motors</h1>
          <p>Seminovos revisados · financiamento e troca</p>
        </div>
      </header>
      <div class="demo">
        Demonstração de portfólio: os dados ficam salvos só neste navegador.
      </div>
      <nav role="tablist" aria-label="Seções">
        <button role="tab" data-tab="shop" aria-selected="true">Vitrine</button>
        <button role="tab" data-tab="panel" aria-selected="false">
          Painel da loja
        </button>
      </nav>

      <section id="v-shop">
        <div class="card">
          <div class="fg">
            <div>
              <label for="fq">Buscar</label
              ><input id="fq" placeholder="Marca ou modelo" />
            </div>
            <div>
              <label for="fm">Marca</label
              ><select id="fm"></select>
            </div>
            <div>
              <label for="fp">Preço máximo</label
              ><select id="fp">
                <option value="">Qualquer</option>
                <option value="50000">Até R$ 50 mil</option>
                <option value="80000">Até R$ 80 mil</option>
                <option value="100000">Até R$ 100 mil</option>
                <option value="130000">Até R$ 130 mil</option>
              </select>
            </div>
            <div>
              <label for="fa">Ano a partir de</label
              ><select id="fa">
                <option value="">Qualquer</option>
                <option>2018</option>
                <option>2020</option>
                <option>2022</option>
              </select>
            </div>
            <div>
              <label for="fc">Câmbio</label
              ><select id="fc">
                <option value="">Todos</option>
                <option>Manual</option>
                <option>Automático</option>
              </select>
            </div>
            <div>
              <label for="fb">Combustível</label
              ><select id="fb">
                <option value="">Todos</option>
                <option>Flex</option>
                <option>Diesel</option>
                <option>Híbrido</option>
              </select>
            </div>
          </div>
        </div>
        <div class="bar">
          <span id="cnt"></span
          ><label
            >Ordenar
            <select id="fo">
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
              <option value="novo">Mais novos</option>
              <option value="km">Menor km</option>
            </select></label
          >
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <section id="v-panel" hidden>
        <div class="stats">
          <div class="stat"><b id="s1">0</b><span>carros à venda</span></div>
          <div class="stat">
            <b id="s2">R$ 0</b><span>valor em estoque</span>
          </div>
          <div class="stat">
            <b id="s3">0</b><span>clientes interessados</span>
          </div>
        </div>
        <div class="card">
          <h2 id="ft">Adicionar carro</h2>
          <div class="fg">
            <div><label for="fma">Marca</label><input id="fma" /></div>
            <div><label for="fmo">Modelo</label><input id="fmo" /></div>
            <div>
              <label for="fan">Ano</label
              ><input id="fan" type="number" min="1990" max="2027" />
            </div>
            <div>
              <label for="fkm">Quilometragem</label
              ><input id="fkm" type="number" min="0" />
            </div>
            <div>
              <label for="fpr">Preço (R$)</label
              ><input id="fpr" type="number" min="0" />
            </div>
            <div>
              <label for="fca">Câmbio</label
              ><select id="fca">
                <option>Manual</option>
                <option>Automático</option>
              </select>
            </div>
            <div>
              <label for="fco">Combustível</label
              ><select id="fco">
                <option>Flex</option>
                <option>Diesel</option>
                <option>Híbrido</option>
              </select>
            </div>
            <div>
              <label for="fcl">Cor</label
              ><input id="fcl" type="color" value="#1F4E9C" />
            </div>
            <div>
              <label for="fst">Situação</label
              ><select id="fst">
                <option value="disponivel">Disponível</option>
                <option value="reservado">Reservado</option>
                <option value="vendido">Vendido</option>
              </select>
            </div>
          </div>
          <p class="err" id="er" role="alert"></p>
          <div style="display: flex; gap: 8px">
            <button class="btn" id="fs">Adicionar carro</button
            ><button class="btn ghost" id="fx" hidden>Cancelar edição</button>
          </div>
        </div>
        <div class="card">
          <h2>Estoque</h2>
          <div class="tbl" id="tb"></div>
        </div>
        <div class="card">
          <h2>Clientes interessados</h2>
          <div class="tbl" id="ld"></div>
        </div>
        <button class="btn ghost" id="rst">Restaurar dados de exemplo</button>
      </section>
    </div>

    <div class="ov" id="ov" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-labelledby="mt">
        <div id="mp"></div>
        <h2 id="mt"></h2>
        <dl id="md"></dl>
        <div class="fg">
          <div>
            <label for="mn">Seu nome</label
            ><input id="mn" autocomplete="name" />
          </div>
          <div>
            <label for="mf">Telefone com DDD</label
            ><input id="mf" type="tel" autocomplete="tel" />
          </div>
        </div>
        <p class="err" id="me" role="alert"></p>
        <div style="display: flex; gap: 8px">
          <button class="btn" id="mi">Tenho interesse</button
          ><button class="btn ghost" id="mc">Fechar</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const brl = (n) => "R$ " + Number(n).toLocaleString("pt-BR");
      const km = (n) => Number(n).toLocaleString("pt-BR") + " km";
      const ST = {
        disponivel: "Disponível",
        reservado: "Reservado",
        vendido: "Vendido",
      };
      function car(c, w) {
        return `<svg viewBox="0 0 200 84" aria-hidden="true"><path d="M8 62Q10 50 34 46L58 27Q64 23 74 23H128Q140 23 148 31L164 46Q188 48 191 62V68H8Z" fill="${c}"/><path d="M66 32L96 32V46H52ZM104 32H126Q132 32 138 39L146 46H104Z" fill="#fff" fill-opacity=".6"/><circle cx="52" cy="68" r="14" fill="#1B2236" stroke="${w || "#fff"}" stroke-width="3"/><circle cx="150" cy="68" r="14" fill="#1B2236" stroke="${w || "#fff"}" stroke-width="3"/><circle cx="52" cy="68" r="5" fill="#9AA7BC"/><circle cx="150" cy="68" r="5" fill="#9AA7BC"/></svg>`;
      }
      $("#logo").innerHTML = car("#fff", "#fff");
      const seed = () => [
        {
          id: 1,
          marca: "Toyota",
          modelo: "Corolla XEi",
          ano: 2021,
          km: 48200,
          preco: 124900,
          cambio: "Automático",
          comb: "Flex",
          cor: "#B8BEC8",
          st: "disponivel",
        },
        {
          id: 2,
          marca: "Honda",
          modelo: "Civic Touring",
          ano: 2020,
          km: 61300,
          preco: 129900,
          cambio: "Automático",
          comb: "Flex",
          cor: "#1B2236",
          st: "reservado",
        },
        {
          id: 3,
          marca: "Volkswagen",
          modelo: "Polo Highline",
          ano: 2022,
          km: 27800,
          preco: 98900,
          cambio: "Automático",
          comb: "Flex",
          cor: "#C8102E",
          st: "disponivel",
        },
        {
          id: 4,
          marca: "Chevrolet",
          modelo: "Onix LT",
          ano: 2021,
          km: 39400,
          preco: 67900,
          cambio: "Manual",
          comb: "Flex",
          cor: "#E9ECEF",
          st: "disponivel",
        },
        {
          id: 5,
          marca: "Fiat",
          modelo: "Argo Drive",
          ano: 2022,
          km: 22100,
          preco: 72500,
          cambio: "Manual",
          comb: "Flex",
          cor: "#2F6FD6",
          st: "disponivel",
        },
        {
          id: 6,
          marca: "Hyundai",
          modelo: "HB20 Comfort",
          ano: 2019,
          km: 58700,
          preco: 58900,
          cambio: "Manual",
          comb: "Flex",
          cor: "#7C8696",
          st: "disponivel",
        },
        {
          id: 7,
          marca: "Jeep",
          modelo: "Compass Longitude",
          ano: 2020,
          km: 70500,
          preco: 139900,
          cambio: "Automático",
          comb: "Diesel",
          cor: "#3E4A3D",
          st: "disponivel",
        },
        {
          id: 8,
          marca: "Renault",
          modelo: "Kwid Zen",
          ano: 2023,
          km: 12400,
          preco: 49900,
          cambio: "Manual",
          comb: "Flex",
          cor: "#E58A1F",
          st: "disponivel",
        },
        {
          id: 9,
          marca: "Ford",
          modelo: "Ranger XLS",
          ano: 2018,
          km: 96200,
          preco: 159900,
          cambio: "Automático",
          comb: "Diesel",
          cor: "#F1F3F5",
          st: "disponivel",
        },
        {
          id: 10,
          marca: "Nissan",
          modelo: "Kicks SV",
          ano: 2022,
          km: 31600,
          preco: 104900,
          cambio: "Automático",
          comb: "Flex",
          cor: "#9B2C3F",
          st: "disponivel",
        },
        {
          id: 11,
          marca: "Toyota",
          modelo: "Corolla Altis Hybrid",
          ano: 2022,
          km: 24300,
          preco: 149900,
          cambio: "Automático",
          comb: "Híbrido",
          cor: "#5B6676",
          st: "disponivel",
        },
        {
          id: 12,
          marca: "Volkswagen",
          modelo: "Gol 1.0",
          ano: 2018,
          km: 84900,
          preco: 44900,
          cambio: "Manual",
          comb: "Flex",
          cor: "#D9DEE3",
          st: "vendido",
        },
      ];
      const ld = (k) => {
        try {
          const r = localStorage.getItem(k);
          if (r) return JSON.parse(r);
        } catch (e) {}
        return null;
      };
      let C = ld("prime-c") || seed(),
        L = ld("prime-l") || [];
      const save = () => {
        try {
          localStorage.setItem("prime-c", JSON.stringify(C));
          localStorage.setItem("prime-l", JSON.stringify(L));
        } catch (e) {}
      };
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      };
      const F = {
        q: "",
        marca: "",
        pmax: "",
        ano: "",
        cambio: "",
        comb: "",
        ord: "menor",
      };
      const S = { edit: null, del: null, open: null };

      function rGrid() {
        const q = F.q.toLowerCase();
        const r = C.filter(
          (c) =>
            c.st !== "vendido" &&
            (!F.marca || c.marca === F.marca) &&
            (!F.cambio || c.cambio === F.cambio) &&
            (!F.comb || c.comb === F.comb) &&
            (!F.pmax || c.preco <= +F.pmax) &&
            (!F.ano || c.ano >= +F.ano) &&
            (c.marca + " " + c.modelo).toLowerCase().includes(q),
        );
        r.sort(
          {
            menor: (a, b) => a.preco - b.preco,
            maior: (a, b) => b.preco - a.preco,
            novo: (a, b) => b.ano - a.ano,
            km: (a, b) => a.km - b.km,
          }[F.ord],
        );
        $("#cnt").textContent =
          r.length === 1
            ? "1 carro encontrado"
            : r.length + " carros encontrados";
        $("#grid").innerHTML = r.length
          ? r
              .map(
                (c) =>
                  `<article class="car"><div class="pic">${c.st === "reservado" ? '<span class="badge">Reservado</span>' : ""}${car(c.cor)}</div><div class="info"><h3>${esc(c.marca)} ${esc(c.modelo)}</h3><span class="meta">${c.ano} · ${km(c.km)} · ${esc(c.cambio)} · ${esc(c.comb)}</span><span class="price">${brl(c.preco)}</span><button class="btn" data-a="open" data-v="${c.id}">Ver detalhes</button></div></article>`,
              )
              .join("")
          : '<p class="empty">Nenhum carro com esses filtros. Tente ampliar a busca.</p>';
      }
      function rFilters() {
        const b = [
          ...new Set(C.filter((c) => c.st !== "vendido").map((c) => c.marca)),
        ].sort();
        $("#fm").innerHTML =
          '<option value="">Todas</option>' +
          b.map((x) => `<option>${esc(x)}</option>`).join("");
        if (!b.includes(F.marca)) F.marca = "";
        $("#fm").value = F.marca;
      }
      function rPanel() {
        const on = C.filter((c) => c.st !== "vendido");
        $("#s1").textContent = on.length;
        $("#s2").textContent = brl(on.reduce((n, c) => n + c.preco, 0));
        $("#s3").textContent = L.length;
        $("#tb").innerHTML = C.length
          ? `<table><tr><th>Carro</th><th>Ano</th><th>Km</th><th>Preço</th><th>Situação</th><th></th></tr>${C.map(
              (c) =>
                `<tr><td><span class="sw" style="background:${esc(c.cor)}"></span>${esc(c.marca)} ${esc(c.modelo)}</td><td>${c.ano}</td><td>${km(c.km)}</td><td>${brl(c.preco)}</td><td><select data-a="st" data-v="${c.id}" aria-label="Situação">${Object.keys(
                  ST,
                )
                  .map(
                    (k) =>
                      `<option value="${k}"${k === c.st ? " selected" : ""}>${ST[k]}</option>`,
                  )
                  .join(
                    "",
                  )}</select></td><td><button class="btn sm ghost" data-a="edit" data-v="${c.id}">Editar</button> <button class="btn sm ghost del" data-a="del" data-v="${c.id}">${S.del === c.id ? "Confirmar exclusão" : "Excluir"}</button></td></tr>`,
            ).join("")}</table>`
          : '<p class="empty">Estoque vazio. Adicione o primeiro carro no formulário acima.</p>';
        $("#ld").innerHTML = L.length
          ? `<table><tr><th>Cliente</th><th>Telefone</th><th>Carro</th><th>Data</th></tr>${L.map((l) => `<tr><td>${esc(l.name)}</td><td>${esc(l.phone)}</td><td>${esc(l.car)}</td><td>${esc(l.date)}</td></tr>`).join("")}</table>`
          : '<p class="empty">Ainda não há interessados. Quando um cliente pedir contato na vitrine, ele aparece aqui.</p>';
      }
      function render() {
        rFilters();
        rGrid();
        rPanel();
      }
      function tab(t) {
        $("#v-shop").hidden = t !== "shop";
        $("#v-panel").hidden = t !== "panel";
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === t));
      }
      function resetForm() {
        S.edit = null;
        ["#fma", "#fmo", "#fan", "#fkm", "#fpr"].forEach(
          (i) => ($(i).value = ""),
        );
        $("#fca").value = "Manual";
        $("#fco").value = "Flex";
        $("#fcl").value = "#1F4E9C";
        $("#fst").value = "disponivel";
        $("#ft").textContent = "Adicionar carro";
        $("#fs").textContent = "Adicionar carro";
        $("#fx").hidden = true;
        $("#er").textContent = "";
      }
      function openCar(id) {
        const c = C.find((x) => x.id === id);
        if (!c) return;
        S.open = c;
        $("#mp").innerHTML =
          `<div class="pic" style="border-radius:8px">${car(c.cor)}</div>`;
        $("#mt").textContent = c.marca + " " + c.modelo + " · " + brl(c.preco);
        $("#md").innerHTML = [
          ["Ano", c.ano],
          ["Quilometragem", km(c.km)],
          ["Câmbio", c.cambio],
          ["Combustível", c.comb],
          ["Situação", ST[c.st]],
        ]
          .map((x) => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`)
          .join("");
        $("#me").textContent = "";
        $("#ov").hidden = false;
        $("#mn").focus();
      }
      const closeM = () => {
        $("#ov").hidden = true;
      };

      document.addEventListener("click", (e) => {
        const n = e.target.closest("nav button");
        if (n) {
          tab(n.dataset.tab);
          return;
        }
        const b = e.target.closest("button[data-a]");
        if (!b) return;
        const a = b.dataset.a,
          id = +b.dataset.v;
        if (a === "open") openCar(id);
        else if (a === "edit") {
          const c = C.find((x) => x.id === id);
          S.edit = id;
          $("#fma").value = c.marca;
          $("#fmo").value = c.modelo;
          $("#fan").value = c.ano;
          $("#fkm").value = c.km;
          $("#fpr").value = c.preco;
          $("#fca").value = c.cambio;
          $("#fco").value = c.comb;
          $("#fcl").value = c.cor;
          $("#fst").value = c.st;
          $("#ft").textContent = "Editar carro";
          $("#fs").textContent = "Salvar alterações";
          $("#fx").hidden = false;
          $("#ft").scrollIntoView({ behavior: "smooth" });
        } else if (a === "del") {
          if (S.del === id) {
            C = C.filter((x) => x.id !== id);
            S.del = null;
            if (S.edit === id) resetForm();
            save();
            render();
            toast("Carro excluído");
            return;
          }
          S.del = id;
          rPanel();
        }
      });
      document.addEventListener("change", (e) => {
        const s = e.target.closest('select[data-a="st"]');
        if (s) {
          C = C.map((c) => (c.id === +s.dataset.v ? { ...c, st: s.value } : c));
          save();
          render();
          toast("Situação atualizada");
        }
      });
      [
        ["#fq", "q"],
        ["#fm", "marca"],
        ["#fp", "pmax"],
        ["#fa", "ano"],
        ["#fc", "cambio"],
        ["#fb", "comb"],
        ["#fo", "ord"],
      ].forEach((x) =>
        $(x[0]).addEventListener("input", (e) => {
          F[x[1]] = e.target.value;
          rGrid();
        }),
      );
      $("#fs").onclick = () => {
        const g = (i) => $(i).value.trim(),
          o = {
            marca: g("#fma"),
            modelo: g("#fmo"),
            ano: +g("#fan"),
            km: +g("#fkm") || 0,
            preco: +g("#fpr"),
            cambio: $("#fca").value,
            comb: $("#fco").value,
            cor: $("#fcl").value,
            st: $("#fst").value,
          },
          er = $("#er");
        if (!o.marca || !o.modelo) {
          er.textContent = "Informe a marca e o modelo.";
          return;
        }
        if (!(o.ano >= 1990 && o.ano <= 2027)) {
          er.textContent = "Informe um ano entre 1990 e 2027.";
          return;
        }
        if (!(o.preco > 0)) {
          er.textContent = "Informe o preço.";
          return;
        }
        if (S.edit) C = C.map((c) => (c.id === S.edit ? { ...c, ...o } : c));
        else C.unshift({ id: Date.now(), ...o });
        save();
        toast(S.edit ? "Alterações salvas" : "Carro adicionado");
        resetForm();
        render();
      };
      $("#fx").onclick = resetForm;
      $("#mc").onclick = closeM;
      $("#ov").addEventListener("click", (e) => {
        if (e.target.id === "ov") closeM();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("#ov").hidden) closeM();
      });
      $("#mi").onclick = () => {
        const n = $("#mn").value.trim(),
          p = $("#mf").value.trim();
        if (n.length < 2) {
          $("#me").textContent = "Informe seu nome.";
          return;
        }
        if (p.replace(/\D/g, "").length < 10) {
          $("#me").textContent = "Informe um telefone com DDD.";
          return;
        }
        L.unshift({
          name: n,
          phone: p,
          car: S.open.marca + " " + S.open.modelo,
          date: new Date().toLocaleDateString("pt-BR"),
        });
        save();
        $("#mn").value = "";
        $("#mf").value = "";
        closeM();
        render();
        toast("Recebemos seu contato. A loja vai retornar em breve.");
      };
      $("#rst").onclick = () => {
        C = seed();
        L = [];
        save();
        resetForm();
        render();
        toast("Dados de exemplo restaurados");
      };
      render();
    </script>
  </body>
</html>
